<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jadwal Harian Juwata</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #00aef1; 
            --danger: #ef4444;
            --success: #22c55e;
            
            --navy-blue: #042759;
            --cyan-teal: #00aef1; 
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            flex-direction: row; 
            justify-content: center; 
            align-items: flex-start; 
            gap: 20px; 
            padding: 25px; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
        }
        
        .control-panel, .visual-panel { 
            background: var(--surface); padding: 25px; border-radius: 24px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); height: fit-content; border: 1px solid var(--border);
        }
        .control-panel { width: 380px; }
        .visual-panel { width: 320px; }
        h3 { margin-top: 0; font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; color: #0f172a; }
        .section-header { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 800; color: var(--text-muted); margin: 20px 0 10px 0; border-bottom: 2px solid var(--border); padding-bottom: 8px;}
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.8rem; color: var(--text-muted); }
        .form-group input[type="text"], .form-group select, .form-group textarea { 
            width: 100%; padding: 12px 15px; box-sizing: border-box; border-radius: 12px; 
            border: 1px solid var(--border); background: #f8fafc; font-size: 0.9rem; font-family: inherit; transition: 0.2s; font-weight: 600;
        }
        .form-group input[type="text"]:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(0, 174, 241, 0.15); }
        .form-group-flex { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; width: 100%; box-sizing: border-box; }
        .form-group-flex select { flex: 2; min-width: 0; }
        .form-group-flex input { flex: 1.2; text-align: center; min-width: 0; }
        .form-group-flex[draggable="true"] { cursor: grab; }
        .form-group-flex[draggable="true"]:active { cursor: grabbing; }
        .form-group-flex.dragging { opacity: 0.5; background: #f1f5f9; border-radius: 12px; }

        button { padding: 12px; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.9rem; width: 100%; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; box-sizing: border-box; }
        .btn-add { background: #e0f2fe; color: var(--primary); margin-bottom: 15px; }
        .btn-add:hover { background: #bae6fd; }
        
        .btn-process { background: linear-gradient(135deg, #00aef1 0%, #66cefa 100%); color: white; margin-bottom: 15px; font-weight: 800; box-shadow: 0 4px 10px rgba(0, 174, 241, 0.3); }
        .btn-process:hover { background: linear-gradient(135deg, #0093cc 0%, #00aef1 100%); }
        
        .btn-delete { background: #fee2e2; color: var(--danger); width: 44px; height: 44px; padding: 0; flex-shrink: 0; z-index: 10; }
        .btn-delete:hover { background: #fecaca; }
        .btn-download { background: var(--text-main); color: white; margin-top: 25px; font-weight: 800; padding: 16px; font-size: 1rem; box-shadow: 0 10px 15px rgba(15, 23, 42, 0.1); }
        .btn-download:hover { background: #000; transform: translateY(-2px); }
        .btn-clear { background: transparent; color: var(--danger); border: 1px solid #fca5a5; margin-bottom: 10px;}
        .cargo-box { border: 2px dashed var(--border); padding: 15px; border-radius: 16px; margin-bottom: 15px; background: #fafafa; }
        .highlight-batal { color: var(--danger) !important; font-weight: 900 !important; background: #fee2e2 !important; border-color: #fca5a5 !important;}

        .preview-container {
            flex: 1 1 auto;
            width: auto;
            min-width: 0;
            height: calc(100svh - 40px);
            min-height: 360px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 20px;
            overflow: hidden;
            border-radius: 24px;
            background: #e2e8f0;
        }

        .preview-wrapper {
            --preview-scale: 0.40;
            width: 1080px;
            height: 1920px;
            flex: 0 0 1080px;
            transform-origin: center center;
            transform: scale(var(--preview-scale));
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            overflow: hidden;
            border: 1px solid var(--border);
            margin: 0;
        }
        #ig-story { width: 1080px; height: 1920px; background-color: #ffffff; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        
        #layer-base-bg, #layer-dynamic-bg, #layer-top-logo {
            position: absolute;
            top: 0;
            left: 0;
            width: 1080px;
            height: 1920px;
        }
        
        #layer-base-bg {
            z-index: 1;
            background-image: url('assets/logo/juwata.png'); 
            background-size: cover;
            background-position: center;
        }

        #layer-dynamic-bg {
            z-index: 2;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            transition: background-position 0.1s ease-out;
        }

        #layer-top-logo {
            z-index: 3;
            pointer-events: none;
        }
        #layer-top-logo img {
            width: 100%;
        }

        #content-layer { 
            position: relative; 
            z-index: 10 !important; 
            width: 100%; 
            height: 100%; 
            padding: 0 45px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column;
            cursor: grab;
            touch-action: none; /* PERBAIKAN: Mencegah scroll di HP */
        }
        #content-layer:active {
            cursor: grabbing;
        }

        #draggable-content { width: 100%; }
        .header-space { height: 160px; } 
        
        #zoomable-title { transform-origin: top center; width: 100%; text-align: center; margin-bottom: 25px;}
        
        /* Default CSS Vars untuk Ukuran Font & Logo Tabel */
        #zoomable-tables { 
            position: relative; left: 50%; transform-origin: top center; width: 990px; margin: 0 auto; transform: translateX(-50%); 
            --table-font-size: 22px;
            --table-th-font-size: 20px;
            --table-logo-size: 35px;
        }

        .title-informasi { color: var(--navy-blue); font-size: 85px; font-weight: 900; line-height: 1; text-transform: uppercase; letter-spacing: 2px;}
        .title-penerbangan { color: var(--cyan-teal); font-size: 80px; font-weight: 900; line-height: 1; text-transform: uppercase; letter-spacing: 1px; margin-top: -5px;}
        .title-bandara { color: var(--navy-blue); font-size: 26px; font-weight: 800; letter-spacing: 2px; margin-top: 15px; margin-bottom: 25px;}

        .date-badge-wrapper { filter: drop-shadow(0 10px 15px rgba(0, 174, 241, 0.25)); margin-bottom: 35px; display: inline-block; }
        .date-badge {
            background-color: var(--cyan-teal); color: white; font-size: 30px; padding: 10px 100px;
            border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; 
            font-weight: 800; transform: skewX(15deg);
        }
        .date-badge-content { transform: skewX(-15deg); display: flex; align-items: center; gap: 15px; }

        .section-wrapper { 
            position: relative; 
            margin-bottom: 40px; 
        }
        
        .section-header-row {
            display: flex;
            align-items: flex-end;
            gap: 15px; 
            margin-left: 15px; 
            margin-right: 15px;
            margin-bottom: -5px; 
            position: relative;
        }

        .icon-box {
            background: var(--cyan-teal);
            width: 90px;
            height:100px; 
            border-radius: 20px 20px 45px 0; 
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: -25px; 
            padding-bottom: 25px; 
            position: relative;
            z-index: 1;
            margin-left: -15px; 
            box-shadow: -4px 6px 15px rgba(0,0,0,0.15); 
        }

        .title-box {
            background: linear-gradient(90deg, #00aef1 0%, var(--navy-blue) 100%);
            height: 75px;
            flex-grow: 1;
            border-radius: 18px 90px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            position: relative;
            z-index: 1;
        }
        .title-box span { color: white; font-size: 28px; font-weight: 800; letter-spacing: 1px; }
        .arrows-pattern { display: flex; align-items: center; gap: -4px; }
        .arrows-pattern svg { margin-left: -8px; }

        .table-gradient-border {
            background: #ffffff; 
            padding: 6px; 
            border-radius: 30px;
            position: relative;
            z-index: 5; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
        }

        .table-white-gap {
            background: white;
            padding: 8px; 
            border-radius: 24px; 
        }

        .table-white-gap table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 16px; 
            overflow: hidden; 
            table-layout: fixed;
            font-family: 'Poppins', sans-serif;
        }

        th { 
            background-color: var(--navy-blue); 
            padding: 8px 10px; 
            height: 65px; 
            color: #ffffff; 
            text-align: center; 
            font-weight: 700; 
            font-size: var(--table-th-font-size);
            border-right: 2px solid rgba(255, 255, 255, 0.2);
        }
        th:last-child { border-right: none; }
        
        td { 
            padding: 8px 10px; 
            height: 75px; 
            text-align: center; 
            border-bottom: 2px solid #e2e8f0; 
            border-right: 2px solid #e2e8f0; 
            color: var(--navy-blue); 
            font-weight: 700; 
            font-size: var(--table-font-size);
            vertical-align: middle;
            word-wrap: break-word;
        }
        td:last-child { border-right: none; }
        tr:last-child td { border-bottom: none; }
        
        tr:nth-child(even) td { background-color: #f4f7f9; } 

        .td-logo { height: var(--table-logo-size); display: inline-block; object-fit: contain; vertical-align: middle; } 
        .time-wrapper { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .clock-icon { width: 24px; height: 24px; stroke: var(--cyan-teal); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round;}
        .highlight-batal-text { color: #ef4444 !important; font-weight: 800 !important; font-size: calc(var(--table-font-size) + 2px); }

        .bottom-section { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 1080px; 
            height: 1920px; 
            z-index: 15; 
            pointer-events: none; 
        }
        .social-banner { 
            width: 100%; 
            height: 100%; 
            background-image: url('assets/logo/logo social.png'); 
            background-size: cover; 
            background-repeat: no-repeat; 
            background-position: center; 
        }

        html {
            box-sizing: border-box;
            -webkit-text-size-adjust: 100%;
            width: 100%;
            min-height: 100%;
        }

        *, *::before, *::after {
            box-sizing: inherit;
        }

        html, body {
            width: 100%;
            min-width: 0;
            margin: 0;
            overflow-x: hidden;
        }

        body {
            min-height: 100svh;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 20px;
            padding: 20px;
        }

        button, input, select, textarea {
            touch-action: manipulation;
        }

        .control-panel {
            flex: 0 0 380px;
            width: 380px;
            min-width: 0;
            max-height: calc(100svh - 40px);
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        /* =====================================================
           BOUNDING BOX & GARIS BANTU TENGAH (SNAP TO CENTER)
           ===================================================== */
        .editor-target {
            position: relative;
            cursor: move;
            touch-action: none;
            transform-origin: top center;
        }

        .editor-target.selected {
            outline: 3px dashed #00aef1 !important;
            outline-offset: 6px;
            background: rgba(0, 174, 241, 0.04);
        }

        .editor-target.selected::after {
            content: attr(data-editor-label);
            position: absolute;
            left: 0;
            top: 0;
            transform: translateY(-100%);
            background: #00aef1;
            color: #fff;
            font: 700 13px/1 Arial, sans-serif;
            padding: 6px 10px;
            border-radius: 6px 6px 0 0;
            pointer-events: none;
            z-index: 99999;
        }

        /* Floating Controls (Slider khusus tabel) */
        .floating-controls {
            position: absolute;
            top: -75px; 
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.98);
            padding: 12px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            display: none;
            z-index: 100000;
            align-items: center;
            gap: 15px;
            pointer-events: auto;
            border: 2px solid #00aef1;
            cursor: default;
        }
        .editor-target.selected .floating-controls {
            display: flex;
        }
        .floating-controls label {
            font-size: 15px;
            font-weight: 800;
            color: var(--navy-blue);
            white-space: nowrap;
        }
        .floating-controls input[type="range"] {
            width: 180px;
            cursor: pointer;
        }

        /* TITIK RESIZE DI SEBELAH KANAN SAJA */
        .resize-handle {
            display: none;
            position: absolute;
            width: 28px;
            height: 28px;
            background: #00aef1;
            border: 3px solid #fff;
            border-radius: 50%;
            z-index: 100000;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
        }
        .editor-target.selected .resize-handle { display: block; }
        
        /* Titik Kanan Tengah -> Tarik Lebar (Memanjangkan) */
        .resize-handle.e { right: -14px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
        
        /* Titik Kanan Bawah -> Tarik Skala (Zoom) */
        .resize-handle.se { right: -14px; bottom: -14px; cursor: nwse-resize; }

        /* Garis Bantu Tengah Vertikal (Otomatis nyala saat digeser) */
        #center-guideline {
            position: absolute;
            top: 0;
            left: 50%;
            width: 3px;
            height: 100%;
            background-color: #00aef1;
            transform: translateX(-50%);
            z-index: 999999;
            display: none;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 174, 241, 0.9);
        }

        .exporting .editor-target { outline: none !important; background: transparent !important; }
        .exporting .editor-target::after, .exporting .resize-handle, #center-guideline, .exporting .floating-controls { display: none !important; }
        
        /* =====================================================
           OPTIMASI TAMPILAN MOBILE (LAYAR KECIL / HP)
           ===================================================== */
        @media (max-width: 820px) {
            body { 
                flex-direction: column; 
                align-items: center; 
                gap: 15px; 
                padding: 12px; 
            }
            
            .control-panel { 
                order: 1; /* Kontrol di atas */
                flex: 0 0 auto; 
                width: 100%; 
                max-width: 100%; 
                height: auto; 
                max-height: none; 
                overflow: visible; 
                padding: 18px; 
                border-radius: 20px; 
            }
            
            .preview-container { 
                order: 2; /* Hasil (preview) di bawah kontrol */
                flex: 0 0 auto; 
                width: 100%; 
                max-width: 600px; 
                height: auto; 
                aspect-ratio: 1080 / 1920; 
                min-height: auto; 
                position: relative; 
                top: auto; 
                border-radius: 20px;
                margin-bottom: 20px;
            }

            .form-group-flex select { flex: 1.5; }
            .form-group-flex input { flex: 1; min-width: 60px; }
            .btn-delete { width: 44px; height: 44px; }
            
            .floating-controls { 
                top: -65px; 
                padding: 10px 15px; 
                width: 90%; 
                max-width: 300px; 
                justify-content: center; 
                flex-wrap: wrap; 
                gap: 8px;
            }
            .floating-controls label { font-size: 13px; }
            .floating-controls input[type="range"] { width: 100%; }
            
            .resize-handle { width: 36px; height: 36px; }
            .resize-handle.e { right: -18px; }
            .resize-handle.se { right: -18px; bottom: -18px; }
        }

        @media print {
            .no-print { display: none !important; }
            .preview-container { width: 1080px !important; height: 1920px !important; transform: none !important; margin: 0 !important; overflow: visible !important; aspect-ratio: auto !important; max-width: none !important; }
            .preview-wrapper { transform: scale(1) !important; margin: 0 !important; }
            body { background: white; padding: 0; display: block; }
        }
    </style>
</head>
<body>

    <div class="control-panel no-print">
        <h3>Jadwal Juwata</h3>
        
        <div class="form-group">
            <label style="color:var(--primary); font-size:0.9rem;">Verdy Ramadana</label>
            <textarea id="whatsapp-input" rows="6" placeholder="Paste log Whatsapp di sini..."></textarea>
        </div>
        <button type="button" class="btn-process" onclick="processWhatsAppChat()">Proses Data Chat</button>
        
        <div class="form-group" style="margin-bottom: 20px;">
            <label>Latar (1-62)</label>
            <select id="bg-selector" onchange="renderPreview()"></select>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label>Teks Tanggal (Edit Bebas)</label>
            <input type="text" id="input-date" onkeyup="renderPreview()">
        </div>

        <button type="button" class="btn-clear" onclick="clearAllData()">Hapus Semua</button>

        <div class="section-header">Keberangkatan</div>
        <div id="depart-inputs-container"></div>
        <button type="button" class="btn-add" onclick="addDepartRow()">+ Tambah Keberangkatan</button>

        <div class="section-header">Kedatangan</div>
        <div id="arrival-inputs-container"></div>
        <button type="button" class="btn-add" onclick="addArrivalRow()">+ Tambah Kedatangan</button>

        <div class="section-header">Cargo Flight</div>
        <div id="cargo-inputs-container"></div>
        <button type="button" class="btn-add" onclick="addCargoRow()">+ Tambah Cargo</button>
        <button type="button" onclick="downloadStory()" class="btn-download">Unduh PNG</button>
    </div>

    <div class="preview-container">
        <div class="preview-wrapper" id="capture-wrapper">
            <div id="ig-story">
                
                <!-- Garis Bantu Tengah -->
                <div id="center-guideline"></div>

                <div id="layer-base-bg"></div>
                <div id="layer-dynamic-bg"></div>
                <div id="layer-top-logo">
                    <img src="assets/logo/logo social.png" alt="Header Logo">
                </div>

                <div id="content-layer">
                    <div class="header-space"></div>
                    
                    <div id="draggable-content">
                        <!-- TARGET 1: JUDUL -->
                        <div id="zoomable-title" class="editor-target" data-editor-label="JUDUL & TANGGAL">
                            <!-- PERBAIKAN: Hanya 2 titik resize di Kanan -->
                            <div class="resize-handle e" data-handle="e"></div>
                            <div class="resize-handle se" data-handle="se"></div>

                            <div class="title-informasi">INFORMASI</div>
                            <div class="title-penerbangan">PENERBANGAN</div>
                            <div class="title-bandara">BANDARA JUWATA TARAKAN</div>
                            
                            <div class="date-badge-wrapper">
                                <div class="date-badge">
                                    <div class="date-badge-content">
                                        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
                                            <circle cx="8" cy="15" r="1.5" fill="currentColor"></circle><circle cx="12" cy="15" r="1.5" fill="currentColor"></circle><circle cx="16" cy="15" r="1.5" fill="currentColor"></circle>
                                        </svg>
                                        <span id="display-date">Memuat Tanggal...</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- TARGET 2: TABEL -->
                        <div id="zoomable-tables" class="editor-target" data-editor-label="TABEL PENERBANGAN">
                            
                            <!-- Slider Khusus Tabel -->
                            <div class="floating-controls no-print" id="table-scale-controls">
                                <label>Font & Logo</label>
                                <input type="range" id="table-content-slider" min="0.5" max="2" step="0.05" value="1" oninput="updateTableContentScale(this.value)" onpointerdown="event.stopPropagation()">
                            </div>

                            <!-- PERBAIKAN: Hanya 2 titik resize di Kanan -->
                            <div class="resize-handle e" data-handle="e"></div>
                            <div class="resize-handle se" data-handle="se"></div>
                            
                            <div id="departures-area" class="section-wrapper" style="display: none;">
                                <div class="section-header-row">
                                    <div class="icon-box">
                                        <svg width="45" height="45" viewBox="0 0 24 24" fill="white">
                                            <path d="M2.5 19h19v2h-19zm19.57-9.36c-.21-.8-1.04-1.28-1.84-1.06L14.92 10l-6.9-6.43-1.93.51 4.14 7.17-4.97 1.33-1.97-1.54-1.45.39 1.82 3.16.77 1.33 1.6-.43 5.31-1.42 4.35-1.16L21 11.49c.81-.23 1.28-1.05 1.07-1.85z"/>
                                        </svg>
                                    </div>
                                    <div class="title-box">
                                        <span>KEBERANGKATAN</span>
                                        <div class="arrows-pattern">
                                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-dasharray="2 3" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-dasharray="2 3" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.6"><polyline points="9 18 15 12 9 6"></polyline></svg>

        function getTodayDateIndo() {

        function updatePreviewScale() {
            const container = document.querySelector('.preview-container');
            const wrapper = document.getElementById('capture-wrapper');
            if (!container || !wrapper) return;

            const availableWidth = Math.max(1, container.clientWidth);
            const availableHeight = Math.max(1, container.clientHeight);

            const scale = Math.min(
                (availableWidth - 12) / 1080,
                (availableHeight - 12) / 1920
            );

            wrapper.style.setProperty('--preview-scale', Math.max(0.1, scale));
        }

        window.addEventListener('resize', updatePreviewScale);

        function buildOptions(defaultCode) {
            let opts = '<option value="">- Pilih Maskapai -</option>';

        let idCounter = 0;
        function addDepartRow(code='', time='', skipRender=false) {
            idCounter++;

            initDragAndDrop(document.getElementById(`row-d-${idCounter}`));
            checkBatal('d', idCounter);
            if(!skipRender) renderPreview();
        }

        function addArrivalRow(code='', time='', skipRender=false) {
            idCounter++;
            document.getElementById('arrival-inputs-container').insertAdjacentHTML('beforeend', `
                <div class="form-group-flex" id="row-a-${idCounter}" draggable="true">
                    <select class="inp-a-code" onchange="autoFill('a', ${idCounter}); renderPreview()">${buildOptions(code)}</select>
                    <input type="text" class="inp-a-time" id="time-a-${idCounter}" value="${time}" placeholder="Jam/Batal" onkeyup="formatTimeInput(this); checkBatal('a', ${idCounter}); renderPreview()">

                </div>
            `);

            checkBatal('a', idCounter);
            if(!skipRender) renderPreview();
        }

        function initDragAndDrop(rowElement) {
            rowElement.addEventListener('dragstart', () => rowElement.classList.add('dragging'));
            rowElement.addEventListener('dragend', () => {
                rowElement.classList.remove('dragging');
                renderPreview();
            });
        }

        ['depart-inputs-container', 'arrival-inputs-container'].forEach(containerId => {
            const container = document.getElementById(containerId);
            container.addEventListener('dragover', e => {
                e.preventDefault();
                const afterElement = getDragAfterElement(container, e.clientY);
                const draggingRow = document.querySelector('.dragging');
                if (draggingRow && draggingRow.parentNode === container) {
                    if (afterElement == null) container.appendChild(draggingRow);
                    else container.insertBefore(draggingRow, afterElement);
                }
            });
        });

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.form-group-flex:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
                else return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function deleteRowWithPair(type, id) {
            const currentRow = document.getElementById(`row-${type}-${id}`);
            if (!currentRow) return;
            const currentCode = currentRow.querySelector(`select`).value;
            currentRow.remove();

            if (currentCode && flightPairs[currentCode]) {
                const pairCode = flightPairs[currentCode];
                const targetType = (type === 'd') ? 'a' : 'd'; 
                const allOppositeSelects = document.querySelectorAll(`.inp-${targetType}-code`);
                allOppositeSelects.forEach(selectEl => {
                    if (selectEl.value === pairCode) {
                        const pairRow = selectEl.closest('.form-group-flex');
                        if (pairRow) pairRow.remove();
                    }
                });
            }
            renderPreview();
        }

        function autoFill(type, id) {
            const inputTime = document.getElementById(`time-${type}-${id}`);
            if(inputTime && inputTime.value === "") inputTime.value = "";
            checkBatal(type, id);
        }

        function formatTimeInput(input) {
            let val = input.value.trim();
            if (/^\d{4}$/.test(val)) {
                let hh = val.substring(0, 2);
                let mm = val.substring(2, 4);
                input.value = `${hh}:${mm} WITA`;
            }
        }

        function checkBatal(type, id) {
            const input = document.getElementById(`time-${type}-${id}`);
            if (input) {
                const val = input.value.toUpperCase();
                if(val.includes("BATAL") || val.includes("DELAY")) input.classList.add("highlight-batal");
                else input.classList.remove("highlight-batal");
            }
        }

        function processWhatsAppChat() {
            const text = document.getElementById('whatsapp-input').value;
            if (!text.trim()) {
                alert("Masukkan input chat terlebih dahulu.");
                return;
            }

            const defaultPairTimes = {
                "IU 693": "10:50 WITA", "IU 694": "10:10 WITA",
                "IU 695": "13:30 WITA", "IU 535": "12:50 WITA",
                "IU 534": "15:30 WITA", "IU 692": "14:50 WITA",
                "QG 401": "11:00 WITA", "QG 400": "10:30 WITA",
                "ID 6675": "14:35 WITA", "ID 6674": "13:55 WITA",
                "QZ 771": "10:30 WITA", "QZ 770": "09:20 WITA"
            };

            let departures = [];
            let arrivals = [];
            let cargos = [];

            const lines = text.split('\n');
            let isCancelSection = false;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                let upperLine = line.toUpperCase();

                if (!line) continue;

                if (upperLine.includes("FLIGHT CANCEL") || upperLine.includes("CANCEL FLIGHT") || upperLine.includes("*FLIGHT CANCEL*") || upperLine.startsWith("CANCEL")) {
                    isCancelSection = true;
                    continue; 
                }
                if (upperLine.includes("OPERATE") || upperLine.includes("*OPERATE*") || upperLine.includes("PAX:") || upperLine.includes("CARGO :")) {
                    isCancelSection = false;
                    continue;
                }

                if (upperLine.includes("SQS") || upperLine.includes("SI ")) {
                    if (upperLine.includes("CARGO")) continue;

                    const susiRegex = /(SQS|SI)\s*(\d{3,4})/i;
                    const match = line.match(susiRegex);
                    if (match) {
                        let flightCode = match[1].toUpperCase() + " " + match[2];
                        let timeMatch = line.match(/(?:ETD|ETA)\s*(\d{2}[:.]\d{2})/i);
                        if (!timeMatch) timeMatch = line.match(/(\d{2}[:.]\d{2})/);
                        
                        let timeStr = timeMatch ? timeMatch[1].replace('.', ':') + " WITA" : "";
                        let finalStatusTime = isCancelSection ? "BATAL" : timeStr;
                        let isDepart = upperLine.includes("ETD");
                        let isArrival = upperLine.includes("ETA");

                        if (!isDepart && !isArrival) isDepart = upperLine.startsWith("TRK-");
                        if (isDepart) departures.push({ code: flightCode, time: finalStatusTime });
                        else arrivals.push({ code: flightCode, time: finalStatusTime });
                    }
                    continue; 
                }

                const flightRegex = /(JT|IU|ID|QG|QZ)\s*(\d{3,4})(?:\/(\d{3,4}))?/i;
                if (flightRegex.test(line)) {
                    const match = line.match(flightRegex);
                    let baseCode = match[1].toUpperCase() + " " + match[2];
                    let altCode = match[3] ? match[1].toUpperCase() + " " + match[3] : null;

                    if (baseCode === "QG 400" || baseCode === "QG 401") {
                        let textBlock = text.toUpperCase();
                        let staMatch = textBlock.match(/STA\s*TRK\s*(\d{2}[:.]\d{2})/);
                        let stdMatch = textBlock.match(/STD\s*TRK\s*(\d{2}[:.]\d{2})/);

                        let arrivalTime = staMatch ? staMatch[1].replace('.', ':') + " WITA" : "10:30 WITA";
                        let departTime = stdMatch ? stdMatch[1].replace('.', ':') + " WITA" : "11:00 WITA";

                        arrivals.push({ code: "QG 400", time: isCancelSection ? "BATAL" : arrivalTime });
                        departures.push({ code: "QG 401", time: isCancelSection ? "BATAL" : departTime });
                        continue;
                    }

                    let timeMatch = line.match(/(\d{2}[:.]\d{2})/);
                    let timeStr = timeMatch ? timeMatch[1].replace('.', ':') + " WITA" : (defaultPairTimes[baseCode] || "");
                    let finalStatusTime = isCancelSection ? "BATAL" : timeStr;
                    let isDepart = true;
                    if (upperLine.includes("SUB - TRK") || upperLine.includes("BPN - TRK") || upperLine.includes("CGK - TRK") || upperLine.startsWith("BPN-TRK") || upperLine.startsWith("SURABAYA")) {
                        isDepart = false;
                    }

                    if (isDepart) {
                        departures.push({ code: baseCode, time: finalStatusTime });
                        if (altCode) departures.push({ code: altCode, time: finalStatusTime });
                    } else {
                        arrivals.push({ code: baseCode, time: finalStatusTime });
                        if (altCode) arrivals.push({ code: altCode, time: finalStatusTime });
                    }

                    if (flightPairs[baseCode]) {
                        let pairCode = flightPairs[baseCode];
                        let pairTimeStr = isCancelSection ? (defaultPairTimes[pairCode] || "") : (defaultPairTimes[pairCode] || "");
                        if (isDepart) arrivals.push({ code: pairCode, time: pairTimeStr });
                        else departures.push({ code: pairCode, time: pairTimeStr });
                    }
                }
            }

            let existingDepCodes = Array.from(document.querySelectorAll(`#depart-inputs-container select`)).map(el => el.value);
            let existingArrCodes = Array.from(document.querySelectorAll(`#arrival-inputs-container select`)).map(el => el.value);
            
            departures = departures.filter((v, i, a) => a.findIndex(t => t.code === v.code) === i);
            arrivals = arrivals.filter((v, i, a) => a.findIndex(t => t.code === v.code) === i);

            departures.forEach(d => {
                if (!existingDepCodes.includes(d.code)) {
                    addDepartRow(d.code, d.time, true);
                    existingDepCodes.push(d.code);
                } else { 
                    const rows = document.querySelectorAll(`#depart-inputs-container .form-group-flex`);
                    rows.forEach(row => {
                        if(row.querySelector('select').value === d.code) {
                            let currentInp = row.querySelector('input[type="text"]');
                            if(d.time === "BATAL" || currentInp.value === "" || d.time !== "") {
                                currentInp.value = d.time;
                            }
                        }
                    });
                }
            });
            
            arrivals.forEach(a => {
                if (!existingArrCodes.includes(a.code)) {
                    addArrivalRow(a.code, a.time, true);
                    existingArrCodes.push(a.code);
                } else {
                    const rows = document.querySelectorAll(`#arrival-inputs-container .form-group-flex`);
                    rows.forEach(row => {
                        if(row.querySelector('select').value === a.code) {
                            let currentInp = row.querySelector('input[type="text"]');
                            if(a.time === "BATAL" || currentInp.value === "" || a.time !== "") {
                                currentInp.value = a.time;
                            }
                        }
                    });
                }
            });

            document.getElementById('whatsapp-input').value = ""; 
            sortFormRowsByTime('depart-inputs-container');
            sortFormRowsByTime('arrival-inputs-container');
            renderPreview();
        }

        function sortFormRowsByTime(containerId) {
            const container = document.getElementById(containerId);
            const rows = Array.from(container.querySelectorAll('.form-group-flex'));
            
            rows.sort((a, b) => {
                let timeA = a.querySelector('input[type="text"]').value.toUpperCase();
                let timeB = b.querySelector('input[type="text"]').value.toUpperCase();
                
                if (timeA === "") return 1; 
                if (timeB === "") return -1;
                if (timeA.includes("BATAL")) return 1; 
                if (timeB.includes("BATAL")) return -1;
                return timeA.localeCompare(timeB);
            });
            rows.forEach(row => container.appendChild(row));
        }

        function updateTableContentScale(scaleValue) {
            const tableContainer = document.getElementById('zoomable-tables');
            const baseFontSize = 22;
            const baseThFontSize = 20;
            const baseLogoSize = 35;

            tableContainer.style.setProperty('--table-font-size', (baseFontSize * scaleValue) + 'px');
            tableContainer.style.setProperty('--table-th-font-size', (baseThFontSize * scaleValue) + 'px');
            tableContainer.style.setProperty('--table-logo-size', (baseLogoSize * scaleValue) + 'px');
        }

        function renderPreview() {
            document.getElementById('display-date').innerText = document.getElementById('input-date').value;
            const bgId = document.getElementById('bg-selector').value;
            document.getElementById('layer-dynamic-bg').style.backgroundImage = `url('assets/background/${bgId}.png')`;

            // 1. Keberangkatan
            const depRows = document.querySelectorAll(`#depart-inputs-container .form-group-flex`);
            const depArea = document.getElementById('departures-area');
            const depBody = document.getElementById('tbody-depart');
            depBody.innerHTML = '';
            
            let activeDepCount = 0;
            depRows.forEach(row => {
                const code = row.querySelector('select').value;
                const time = row.querySelector('input[type="text"]').value;
                const isBatal = time.toUpperCase().includes("BATAL") || time.toUpperCase().includes("DELAY");
                
                if (code && dbFlight[code]) {
                    activeDepCount++;
                    const data = dbFlight[code];
                    let timeHtml = isBatal ? `<span class="highlight-batal-text">${time}</span>` : `<div class="time-wrapper">${clockSvg} ${time}</div>`;
                    
                    depBody.innerHTML += `<tr>
                        <td><span class="table-cell-text">${code}</span></td>
                        <td><img class="td-logo" src="assets/logo/${data.logo}.png"></td>
                        <td><span class="table-cell-text">${data.tujuan}</span></td>
                        <td>${timeHtml}</td>
                    </tr>`;
                }
            });
            depArea.style.display = (activeDepCount === 0) ? 'none' : 'block';

            // 2. Kedatangan
            const arrRows = document.querySelectorAll(`#arrival-inputs-container .form-group-flex`);
            const arrArea = document.getElementById('arrivals-area');
            const arrBody = document.getElementById('tbody-arrival');
            arrBody.innerHTML = '';
            
            let activeArrCount = 0;
            arrRows.forEach(row => {
                const code = row.querySelector('select').value;
                const time = row.querySelector('input[type="text"]').value;
                const isBatal = time.toUpperCase().includes("BATAL") || time.toUpperCase().includes("DELAY");
                
                if (code && dbFlight[code]) {
                    activeArrCount++;
                    const data = dbFlight[code];
                    let timeHtml = isBatal ? `<span class="highlight-batal-text">${time}</span>` : `<div class="time-wrapper">${clockSvg} ${time}</div>`;
                    
                    arrBody.innerHTML += `<tr>
                        <td><span class="table-cell-text">${code}</span></td>
                        <td><img class="td-logo" src="assets/logo/${data.logo}.png"></td>
                        <td><span class="table-cell-text">${data.tujuan}</span></td>
                        <td>${timeHtml}</td>
                    </tr>`;
                }
            });
            arrArea.style.display = (activeArrCount === 0) ? 'none' : 'block';

            // 3. Cargo
            const cargoBoxes = document.querySelectorAll(`.cargo-box`);
            const cargoArea = document.getElementById('cargo-area');
            const cargoBody = document.getElementById('tbody-cargo');
            cargoBody.innerHTML = '';
            
            let activeCargoCount = 0;
            cargoBoxes.forEach(box => {
                const logo = box.querySelector('.inp-c-logo').value;
                const flight = box.querySelector('.inp-c-flight').value;
                const rute = box.querySelector('.inp-c-rute').value;
                const ktg = box.querySelector('.inp-c-ktg').value;
                const bkt = box.querySelector('.inp-c-bkt').value;
                
                const isBatalKtg = ktg.toUpperCase().includes("BATAL");
                const isBatalBkt = bkt.toUpperCase().includes("BATAL");

                if (flight) {
                    activeCargoCount++;
                    let logoUrl = logo === 'myindo' ? 'assets/logo/MyIndo.png' : 'assets/logo/Eca.png';
                    let htmlKtg = isBatalKtg ? `<span class="highlight-batal-text">${ktg}</span>` : (ktg ? `<div class="time-wrapper">${clockSvg} ${ktg}</div>` : '-');
                    let htmlBkt = isBatalBkt ? `<span class="highlight-batal-text">${bkt}</span>` : (bkt ? `<div class="time-wrapper">${clockSvg} ${bkt}</div>` : '-');

                    cargoBody.innerHTML += `<tr>
                        <td><span class="table-cell-text">${flight}</span></td>
                        <td><img class="td-logo" src="${logoUrl}"></td>
                        <td><span class="table-cell-text">${rute}</span></td>
                        <td>${htmlKtg}</td>
                        <td>${htmlBkt}</td>
                    </tr>`;
                }
            });
            cargoArea.style.display = (activeCargoCount === 0) ? 'none' : 'block';
        }

        /* PERBAIKAN: Fungsi Unduh untuk Mendukung iPhone (Web Share API) */
        async function downloadStory() {
            document.body.classList.add('exporting');
            const container = document.getElementById('capture-wrapper');
            const oldTransform = container.style.transform;
            container.style.transform = 'scale(1)';

            try {
                const canvas = await html2canvas(document.getElementById('ig-story'), {
                    scale: 2, useCORS: true, allowTaint: true, backgroundColor: '#ffffff', logging: false
                });

                const dayName = document.getElementById('input-date').value.split(',')[0] || 'Story';
                const fileName = `Jadwal_Penerbangan_${dayName}.png`;

                // Convert canvas ke Blob (File)
                canvas.toBlob(async function(blob) {
                    const file = new File([blob], fileName, { type: 'image/png' });

                    // CEK APAKAH HP SUPPORT WEB SHARE API (Khususnya iPhone/iOS)
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'Jadwal Juwata',
                            });
                            // Jika sukses, gambar sudah disimpan/dibagikan
                        } catch (err) {
                            console.log('User membatalkan share', err);
                        }
                    } else {
                        // FALLBACK: Untuk PC atau Android lama (Download biasa)
                        const link = document.createElement('a');
                        link.download = fileName;
                        link.href = URL.createObjectURL(blob);
                        link.click();
                        
                        // Bersihkan memori URL
                        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
                    }
                }, 'image/png');

            } catch (error) {
                alert('Gagal membuat gambar. Silakan coba lagi.');
                console.error(error);
            } finally {
                // Kembalikan tampilan seperti semula
                setTimeout(() => {
                    container.style.transform = oldTransform;
                    document.body.classList.remove('exporting');
                    updatePreviewScale();
                }, 500); 
            }
        }

        let activeTarget = null;
        let activeHandle = null;
        let isDragging = false, isResizing = false;
        let startX = 0, startY = 0;
        let initialTranslateX = 0, initialTranslateY = 0;
        let initialScale = 1;
        let initialWidth = 990;
        
        // Variabel untuk fitur pinch-to-zoom 2 jari
        let initialPinchDistance = null;
        let initialPinchScale = 1;

        let isDraggingBg = false;
        let startBgY = 0;
        let currentBgPosY = 0;

        function getStoredTransform(el) {
            if (!el.dataset.scale) {
                el.dataset.scale = "1";
                el.dataset.tx = "0";
                el.dataset.ty = "0";
            }
            return {
                scale: parseFloat(el.dataset.scale),
                tx: parseFloat(el.dataset.tx),
                ty: parseFloat(el.dataset.ty)
            };
        }

        function applyTransform(el) {
            const t = getStoredTransform(el);
            if (el.id === 'zoomable-tables') {
                el.style.transform = `translateX(-50%) translate(${t.tx}px, ${t.ty}px) scale(${t.scale})`;
            } else {
                el.style.transform = `translate(${t.tx}px, ${t.ty}px) scale(${t.scale})`;
            }
        }

        function initBoundingBoxSystem() {
            const wrapper = document.getElementById('capture-wrapper');
            const guideline = document.getElementById('center-guideline');
            const contentLayer = document.getElementById('content-layer');
            
            const targets = [
                document.getElementById('zoomable-title'),
                document.getElementById('zoomable-tables')
            ];

            targets.forEach(el => {
                if (!el) return;
                el.classList.add('editor-target');

                el.addEventListener('pointerdown', (e) => {
                    if (e.target.classList.contains('resize-handle') || e.target.closest('.floating-controls')) return;
                    e.stopPropagation();
                    selectTarget(el);

                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    
                    const t = getStoredTransform(el);
                    initialTranslateX = t.tx;
                    initialTranslateY = t.ty;
                    
                    el.setPointerCapture(e.pointerId);
                });

                el.querySelectorAll('.resize-handle').forEach(handle => {
                    handle.addEventListener('pointerdown', (e) => {
                        e.stopPropagation();
                        isResizing = true;
                        activeHandle = handle.dataset.handle;
                        startX = e.clientX;
                        startY = e.clientY;
                        
                        const t = getStoredTransform(el);
                        initialScale = t.scale;
                        initialWidth = el.offsetWidth;

                        handle.setPointerCapture(e.pointerId);
                    });
                });

                // ===== FUNGSI ZOOM 2 JARI (PINCH) =====
                el.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 2) {
                        isDragging = false; 
                        isResizing = false;
                        
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        initialPinchDistance = Math.sqrt(dx*dx + dy*dy);
                        
                        initialPinchScale = getStoredTransform(el).scale;
                    }
                }, { passive: false });

                el.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 2 && initialPinchDistance) {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        const currentDist = Math.sqrt(dx*dx + dy*dy);
                        
                        let newScale = initialPinchScale * (currentDist / initialPinchDistance);
                        newScale = Math.max(0.3, Math.min(2.5, newScale));
                        
                        el.dataset.scale = newScale;
                        applyTransform(el);
                    }
                }, { passive: false });

                el.addEventListener('touchend', (e) => {
                    if (e.touches.length < 2) {
                        initialPinchDistance = null;
                    }
                });
            });

            contentLayer.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.editor-target')) return;
                
                isDraggingBg = true;
                startY = e.clientY;
                startBgY = parseFloat(document.getElementById('layer-dynamic-bg').dataset.bgY || 0);
                contentLayer.setPointerCapture(e.pointerId);
            });

            /* PERBAIKAN: Mencegah scroll HP tertarik saat menggeser gambar/background */
            contentLayer.addEventListener('touchmove', (e) => {
                if (isDraggingBg || isDragging || isResizing || initialPinchDistance) {
                    e.preventDefault(); 
                }
            }, { passive: false });

            window.addEventListener('pointermove', (e) => {
                // Kunci pergerakan biasa jika sedang menggunakan 2 jari
                if (initialPinchDistance) return;

                const scale = parseFloat(window.getComputedStyle(wrapper).getPropertyValue('--preview-scale')) || 0.4;
                
                if (isDraggingBg) {
                    const dy = (e.clientY - startY) / scale;
                    currentBgPosY = startBgY + dy;
                    const bgLayer = document.getElementById('layer-dynamic-bg');
                    bgLayer.style.backgroundPosition = `center calc(50% + ${currentBgPosY}px)`;
                    bgLayer.dataset.bgY = currentBgPosY;
                    
                    if (e.cancelable) {
                        e.preventDefault();
                    }
                } 
                else if (isDragging && activeTarget) {
                    const dx = (e.clientX - startX) / scale;
                    const dy = (e.clientY - startY) / scale;
                    
                    const t = getStoredTransform(activeTarget);
                    let targetX = initialTranslateX + dx;

                    if (Math.abs(targetX) < 15) {
                        targetX = 0;
                        guideline.style.display = 'block';
                    } else {
                        guideline.style.display = 'none';
                    }

                    t.tx = targetX;
                    t.ty = initialTranslateY + dy;
                    activeTarget.dataset.tx = t.tx;
                    activeTarget.dataset.ty = t.ty;
                    applyTransform(activeTarget);

                } else if (isResizing && activeTarget) {
                    const dx = (e.clientX - startX) / scale;

                    if (activeHandle === 'e') { 
                        // Kanan Tengah: Memanjangkan Lebar
                        let newWidth = initialWidth + (dx * 2); 
                        newWidth = Math.max(300, Math.min(2500, newWidth)); 
                        activeTarget.style.width = `${newWidth}px`;
                        
                        guideline.style.display = 'block';

                    } else if (activeHandle === 'se') { 
                        // Kanan Bawah: Tarik Skala (Zoom)
                        let newScale = initialScale + (dx / 300); 
                        newScale = Math.max(0.3, Math.min(2.5, newScale));
                        
                        activeTarget.dataset.scale = newScale;
                        applyTransform(activeTarget);
                        
                        guideline.style.display = 'block';
                    }
                }
            });

            window.addEventListener('pointerup', () => {
                isDragging = false;
                isResizing = false;
                isDraggingBg = false;
                guideline.style.display = 'none';
            });

            wrapper.addEventListener('click', (e) => {
                if (e.target === wrapper || e.target === contentLayer) deselectAll();
            });
        }

        function selectTarget(el) {
            deselectAll();
            activeTarget = el;
            el.classList.add('selected');
        }

        function deselectAll() {
            document.querySelectorAll('.editor-target').forEach(el => el.classList.remove('selected'));
            activeTarget = null;
            document.getElementById('center-guideline').style.display = 'none';
        }

        window.onload = function() {
            const bgSelector = document.getElementById('bg-selector');
            for (let i = 1; i <= 62; i++) {
                bgSelector.insertAdjacentHTML('beforeend', `<option value="${i}">Gambar ${i}</option>`);
            }

            document.getElementById('input-date').value = getTodayDateIndo();
            updatePreviewScale();
            renderPreview();
            setTimeout(initBoundingBoxSystem, 100);
        };
    </script>
